[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"

[functions."speed2lead-followups"]
  schedule = "*/5 * * * *"

[functions."appointment-reminders"]
  schedule = "*/15 * * * *"

[functions."appointment-calendar-sync"]
  schedule = "*/10 * * * *"

[dev]
  command = "bun run dev"
  port = 3000

# Production cutover — v2 agent + LLM orchestration (PR #81)
[context.production.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"

# Controlled real-phone SMS test on PR deploy previews (see PR #61 readiness report)
[context.deploy-preview.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"
  TWILIO_WEBHOOK_URL = "https://deploy-preview-61--624voice.netlify.app/api/sms/inbound"

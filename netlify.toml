[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"

[functions."speed2lead-followups"]
  schedule = "*/5 * * * *"

[functions."appointment-reminders"]
  schedule = "*/15 * * * *"

[functions."appointment-calendar-sync"]
  schedule = "*/10 * * * *"

[dev]
  command = "bun run dev"
  port = 3000

# Production cutover — v2 agent + LLM orchestration (PR #81)
[context.production.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"
  TWILIO_WEBHOOK_URL = "https://www.624voice.com/api/sms/inbound"

# Preview-only webhook override — NEVER point the live Twilio number here.
# PR #61 used preview-61 for handset testing; that URL must stay on preview deploys only.
[context.deploy-preview.environment]
  SPEED2LEAD_AGENT_V2 = "true"
  SPEED2LEAD_LLM_ENABLED = "true"
  SPEED2LEAD_CONTACT_AGENT_V2 = "true"
  SPEED2LEAD_DEMO_AGENT_V2 = "true"
